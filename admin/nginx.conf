server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;
  add_header X-Robots-Tag "noindex, nofollow" always;

  # Allow crawlers to read the noindex response instead of indexing a login URL
  # without fetching it. Access control remains enforced by authentication.
  location = /robots.txt {
    default_type text/plain;
    return 200 "User-agent: *\nDisallow:\n";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  # All SPA routes resolve here. Never reuse an entry that points to old assets.
  location = /index.html {
    add_header Cache-Control "no-store, max-age=0" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    try_files $uri =404;
  }

  location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2)$ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800, immutable";
    add_header X-Robots-Tag "noindex, nofollow" always;
    try_files $uri =404;
  }
}
