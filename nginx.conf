  upstream frontend_upstream {
    server frontend:3000;
  }

  upstream backend_upstream {
    server backend:3001;
  }


  server {
    listen 80;
    server_name jssngyl.cn www.jssngyl.cn;

    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    # Exact historical entry pages keep their equivalent destination.
    location = /contact/show.php {
      return 301 https://www.jssngyl.cn/zh/contact;
    }

    # Collapse the known legacy directory chain while preserving query parameters.
    location = /about {
      return 301 https://www.jssngyl.cn/zh/about$is_args$args;
    }

    location = /about/ {
      return 301 https://www.jssngyl.cn/zh/about$is_args$args;
    }

    location = /about/show.php {
      return 301 https://www.jssngyl.cn/zh/about;
    }

    location = /product/index.php {
      return 301 https://www.jssngyl.cn/zh/products;
    }

    location = /news/index.php {
      return 301 https://www.jssngyl.cn/zh/news;
    }

    location = /index.php {
      return 301 https://www.jssngyl.cn/zh;
    }

    location = /product/showproduct.php {
      if ($legacy_product_path = "") {
        return 404;
      }
      return 301 https://www.jssngyl.cn$legacy_product_path;
    }

    location = /product/product.php {
      return 301 https://www.jssngyl.cn/zh/products;
    }

    location = /news/shownews.php {
      if ($legacy_news_path = "") {
        return 404;
      }
      return 301 https://www.jssngyl.cn$legacy_news_path;
    }

    location = /news/news.php {
      return 301 https://www.jssngyl.cn/zh/news;
    }

    location ~ \.php$ {
      return 301 https://www.jssngyl.cn/zh;
    }

    location / {
      return 301 https://www.jssngyl.cn$request_uri;
    }
  }

  server {
    listen 80;
    server_name _;

    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    # Exact historical entry pages keep their equivalent destination.
    location = /contact/show.php {
      return 301 /zh/contact;
    }

    location = /about/show.php {
      return 301 /zh/about;
    }

    location = /product/index.php {
      return 301 /zh/products;
    }

    location = /news/index.php {
      return 301 /zh/news;
    }

    location = /index.php {
      return 301 /zh;
    }

    location = /product/showproduct.php {
      if ($legacy_product_path = "") {
        return 404;
      }
      return 301 $legacy_product_path;
    }

    location = /product/product.php {
      return 301 /zh/products;
    }

    location = /news/shownews.php {
      if ($legacy_news_path = "") {
        return 404;
      }
      return 301 $legacy_news_path;
    }

    location = /news/news.php {
      return 301 /zh/news;
    }

    location ~ \.php$ {
      return 301 /zh;
    }

    location /uploads/ {
      alias /var/www/uploads/;
      access_log off;
      expires 30d;
      add_header Cache-Control "public, max-age=2592000, immutable";
      try_files $uri =404;
    }

    location ^~ /api/svc/ {
      return 404;
    }

    location /api/ {
      proxy_pass http://backend_upstream/api/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /admin { return 410; }
    location /admin/ { return 410; }

    location /_next/static/ {
      proxy_pass http://frontend_upstream/_next/static/;
      proxy_http_version 1.1;
      expires 30d;
      add_header Cache-Control "public, max-age=2592000, immutable";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
      proxy_pass http://frontend_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    }
  }

