name: Prepare Immutable Admin Candidate
on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Full current main commit after CI and review
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  candidate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Require exact reviewed main source
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          passed="$(gh run list --workflow 'CI Quality Gate' --branch main --commit "$SOURCE_COMMIT" --event push --status success --limit 1 --json headSha --jq '.[0].headSha')"
          test "$passed" = "$SOURCE_COMMIT"
          test "$(df -Pk . | awk 'NR==2 {print $4}')" -ge 12582912
          echo "SOURCE_COMMIT=$SOURCE_COMMIT" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=suneng-verified-admin:$SOURCE_COMMIT" >> "$GITHUB_ENV"
      - name: Build candidate outside production
        run: |
          set -euo pipefail
          bash scripts/check-no-secrets.sh
          docker build --platform linux/amd64 -f admin/Dockerfile \
            --build-arg VITE_APP_BASE_PATH=/ \
            --build-arg VITE_API_BASE_URL=/api \
            --label "org.opencontainers.image.revision=$SOURCE_COMMIT" \
            --tag "$IMAGE_TAG" .
      - name: Record immutable artifact identity
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/admin-candidate"
          docker save "$IMAGE_TAG" | gzip > "$RUNNER_TEMP/admin-candidate/admin.tar.gz"
          docker image inspect "$IMAGE_TAG" > "$RUNNER_TEMP/admin-candidate/image.json"
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'admin-candidate'
          archive = root / 'admin.tar.gz'
          digest = hashlib.sha256()
          with archive.open('rb') as stream:
              for block in iter(lambda: stream.read(8 * 1024 * 1024), b''):
                  digest.update(block)
          image = json.loads((root / 'image.json').read_text())[0]
          receipt = {'schemaVersion': 1, 'status': 'candidate-not-deployed',
                     'sourceIdentity': 'git-commit', 'sourceCommit': os.environ['SOURCE_COMMIT'],
                     'imageTag': os.environ['IMAGE_TAG'], 'buildImageId': image['Id'],
                     'rootFsDiffIds': image['RootFS']['Layers'], 'imageBytes': image['Size'],
                     'archiveBytes': archive.stat().st_size, 'archiveSha256': digest.hexdigest(),
                     'publicationScope': 'news-products-services-company-reviewed-cases',
                     'component': 'admin',
                     'serverCanaryRequired': True, 'browserAcceptanceRequired': True}
          (root / 'candidate.json').write_text(json.dumps(receipt, indent=2) + '\n')
          (root / 'image.json').unlink()
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: admin-candidate-${{ inputs.source_commit }}
          path: ${{ runner.temp }}/admin-candidate/
          compression-level: 0
          retention-days: 30
