name: Build And Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Applications
    runs-on: ubuntu-latest
    # 实测约 5 分钟。默认 6 小时太长，卡住会白烧机器时间。
    timeout-minutes: 30
    outputs:
      deploy_skip_build: ${{ steps.image_changes.outputs.skip_build }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The frontend test suite reads HEAD^ for lastmod governance.
          fetch-depth: 2

      - name: Detect production image changes
        id: image_changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "手动触发：强制构建。"
            skip_build=0
          else
            # 基线取「上一次成功部署的提交」，不是 HEAD^。
            # HEAD^ 的坑：上一次部署失败时那个提交从没被构建过，
            # 而下一次推送只看最后一个提交，就会认定「不用构建」——改动凭空消失。
            # 2026-08-19 实测：#48 的后端改动因部署超时未构建，#49 只改了工作流文件，
            # 判定跳过构建，差点把 #48 弄丢。当时靠服务端「找不到镜像」的门禁才拦住，
            # 但那道门只挡镜像缺失、不挡镜像陈旧——陈旧才是会静默发错版本的那种。
            base="$(gh run list --workflow 'Build And Deploy' --branch main \
              --status success --limit 1 --json headSha -q '.[0].headSha' 2>/dev/null || true)"
            if [ -n "$base" ]; then
              # checkout 用的是 fetch-depth: 2，基线提交多半不在本地，单独抓一个。
              git fetch --depth=1 origin "$base" 2>/dev/null || true
            fi
            if [ -z "$base" ] || ! git rev-parse --verify "${base}^{commit}" >/dev/null 2>&1; then
              echo "取不到上次成功部署的提交，保守起见强制构建。"
              skip_build=0
            elif scripts/requires-image-build.sh "$base" HEAD; then
              skip_build=0
            else
              skip_build=1
            fi
          fi
          echo "skip_build=$skip_build" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.1

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Secret guard
        run: pnpm check:secrets

      - name: Dependency audit
        run: pnpm audit --audit-level high

      - name: Generate Prisma client
        run: pnpm --dir backend prisma:generate

      # Gate the deploy on the same quality bar as CI: the deploy job below
      # `needs: build`, so a lint/type/test failure blocks the deploy.
      - name: Lint (all packages)
        run: pnpm -r lint

      - name: Typecheck (backend)
        run: pnpm --dir backend exec tsc --noEmit -p tsconfig.json

      - name: Test (all packages)
        run: pnpm -r test

      - name: Install deterministic CJK font
        # runner 默认镜像 azure.archive.ubuntu.com 会整段无响应，apt 随后静默挂死：
        # 2026-08-19 实测两次，一次卡 2 小时、一次卡 27 分钟，全程零输出。
        # 改指官方源，每个 apt 调用单独套 timeout，再加步骤级超时兜底。
        # 刻意不换字体来源——视觉回归的基准图是用这个包渲染的，换了会整片对不上。
        timeout-minutes: 8
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # 不靠 runner 默认 shell 带的 -e：那是隐含行为，改一下 shell 配置就悄悄失效，
          # 安装失败会被 fc-cache 的成功退出码盖住（本地实测裸 bash 下退出 0）。
          set -euo pipefail
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' \
            /etc/apt/sources.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
          for i in 1 2 3; do
            sudo timeout 120 apt-get update -qq && break
            echo "apt-get update 第 $i 次失败，重试"
            sleep 5
          done
          # 三次都失败也继续往下走：索引陈旧仍可能装得上，
          # 真装不上会在下一条 install 上明确报错，不会被悄悄放过。
          sudo timeout 180 apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-cache -f

      - name: Visual regression
        env:
          CI: true
          VISUAL_PROJECT: linux-chrome
        run: pnpm --dir frontend test:visual

      - name: Build backend
        run: pnpm --dir backend build

      - name: Build frontend
        env:
          NEXT_PUBLIC_APP_NAME: Manufacturing Corporate Site
          NEXT_PUBLIC_DEFAULT_LOCALE: zh
          NEXT_PUBLIC_SITE_URL: https://example.com
          NEXT_PUBLIC_API_URL: /api
          NEXT_PUBLIC_API_BASE_URL: /api
          API_BASE_URL_INTERNAL: http://backend:3001/api
        run: pnpm --dir frontend build

      - name: Build admin
        env:
          VITE_APP_NAME: Corporate Admin
          VITE_API_BASE_URL: /api
          VITE_APP_BASE_PATH: /
        run: pnpm --dir admin build

  deploy:
    name: Deploy To Server
    runs-on: ubuntu-latest
    # 实测 31 分钟（服务器上重建镜像）。必须大于下面 ssh 的 command_timeout: 50m，
    # 否则 job 先被杀，ssh 那道超时形同虚设。默认 6 小时太长，卡住会白烧机器时间。
    timeout-minutes: 60
    needs: build
    if: github.ref == 'refs/heads/main'
    concurrency:
      # Production deploys must finish in order. Cancelling an SSH action can
      # leave its remote Docker build running after the runner disconnects.
      group: production-deploy
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Pack source bundle
        run: |
          printf '%s\n' "$GITHUB_SHA" > DEPLOY_COMMIT
          archive="$RUNNER_TEMP/deploy-source.tgz"
          tar \
            --exclude='.git' \
            --exclude='deploy-source.tgz' \
            --exclude='admin/node_modules' \
            --exclude='backend/node_modules' \
            --exclude='frontend/node_modules' \
            --exclude='node_modules' \
            --exclude='.env' \
            --exclude='.env.local' \
            --exclude='.env.production' \
            --exclude='*/.env' \
            --exclude='*/.env.local' \
            --exclude='*/.env.production' \
            --exclude='frontend/.next*' \
            --exclude='frontend/.capture' \
            --exclude='frontend/.captures' \
            --exclude='frontend/docs' \
            --exclude='frontend/reference' \
            --exclude='frontend/tests' \
            --exclude='frontend/test-results' \
            --exclude='docs' \
            --exclude='admin/dist' \
            --exclude='backend/dist' \
            -czf "$archive" \
            .
          cp "$archive" deploy-source.tgz

      - name: Upload source bundle
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USERNAME }}
          key: ${{ secrets.DEPLOY_KEY }}
          source: deploy-source.tgz
          target: ${{ secrets.DEPLOY_PATH }}

      - name: SSH Deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USERNAME }}
          key: ${{ secrets.DEPLOY_KEY }}
          # 2026-08-19 实测：整轮 31 分钟，卡在 30m 上限、构建都快收尾了才被掐。
          # 其中约 20 分钟花在前端类型检查+lint 上（2 核机器）。
          # 提到 50m 只是止血；真正该做的是把前端类型检查挪到 GitHub runner 上，
          # 生产机只负责产出镜像——那是另一件事，别顺手在这里改掉一道门。
          command_timeout: 50m
          script: |
            set -euo pipefail
            lock_file=/var/lock/corp-site-deploy.lock
            exec 9>"$lock_file"
            if ! flock -w 1800 9; then
              echo "Timed out waiting for the production deployment lock: $lock_file"
              exit 75
            fi
            export DEPLOY_LOCK_HELD=1
            cd ${{ secrets.DEPLOY_PATH }}
            tmp_dir="$(mktemp -d)"
            trap 'rm -rf "$tmp_dir"' EXIT
            tar -xzf deploy-source.tgz -C "$tmp_dir"
            rsync -a --no-owner --no-group --delete \
              --exclude='.git/' \
              --exclude='.env' \
              --exclude='.env.production' \
              --exclude='deploy-source.tgz' \
              --exclude='backups/' \
              "$tmp_dir"/ ./
            rm -f deploy-source.tgz
            # Delegate to deploy.sh (the canonical prod pipeline): it builds
            # against docker-compose.prod.yml with --env-file .env.production,
            # runs `prisma migrate deploy`, brings the stack up WITHOUT a full-outage
            # `down`, and health-checks. It aborts if .env.production is missing, so a
            # box without real prod secrets fails fast instead of booting with
            # JWT_SECRET=change-me (which the configuration guard now rejects).
            DEPLOY_EXPECTED_COMMIT=${{ github.sha }} \
              DEPLOY_SKIP_PULL=1 \
              DEPLOY_SKIP_BUILD=${{ needs.build.outputs.deploy_skip_build }} \
              bash deploy.sh

  # 自动部署失败过四次没人察觉（main 领先生产多日才被发现）。
  # 这个任务只在失败时跑，且缺 secret 就静默跳过——告警本身绝不能把部署搞挂。
  notify-failure:
    name: Notify Deploy Failure
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [build, deploy]
    if: failure() && github.ref == 'refs/heads/main'
    steps:
      - name: Post to Feishu
        env:
          WEBHOOK: ${{ secrets.FEISHU_DEPLOY_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
        run: |
          if [ -z "${WEBHOOK:-}" ]; then
            echo "未配置 FEISHU_DEPLOY_WEBHOOK_URL，跳过告警（不影响部署结论）。"
            exit 0
          fi
          # 「部署失败」四个字同时充当飞书自定义关键词，改文案时别把它删了。
          payload=$(python3 -c 'import json,os; text="\n".join(["部署失败：官网 main 未能发布到生产。","提交 "+os.environ["COMMIT"],"触发 "+os.environ["ACTOR"],"详情 "+os.environ["RUN_URL"]]); print(json.dumps({"msg_type":"text","content":{"text":text}}))')
          # 必须先清空响应文件：curl 连不上时不会写它，
          # 残留的上一次成功响应会让失败日志显示 "success"（假绿）。
          : > /tmp/feishu.out
          code=$(curl -sS -o /tmp/feishu.out -w '%{http_code}' -m 15 \
            -X POST -H 'Content-Type: application/json' -d "$payload" "$WEBHOOK") || code=000
          echo "飞书返回 HTTP ${code}: $(head -c 200 /tmp/feishu.out 2>/dev/null)"
          # 告警发不出去不改变部署结论——部署失败本身已由上游任务报出。
          exit 0
