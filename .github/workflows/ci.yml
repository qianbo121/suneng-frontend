# Quality gate: lint + typecheck + unit tests + build for all three packages.
# Unit tests cover the security-critical units (RolesGuard default-deny, upload
# magic-byte validation, rich-text sanitizer). Behavioral/e2e coverage (full
# RBAC routes, ISR, viewcount idempotency) is still validated by the per-batch
# runtime acceptance scripts, not here.
name: CI Quality Gate

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  frontend:
    name: Frontend (lint + test + build)
    runs-on: ubuntu-latest
    # 实测约 7 分钟；2026-08-19 曾卡在装中文字体 2 小时。默认 6 小时太长，卡住会白烧机器时间。
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          # lastmod governance compares committed content with its parent.
          fetch-depth: 2
      - name: Classify visual regression scope
        id: visual_scope
        timeout-minutes: 3
        env:
          VISUAL_EVENT_NAME: ${{ github.event_name }}
          # PR checkout is the actual merge commit; push compares the whole
          # before/after range, including multi-commit pushes.
          VISUAL_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          VISUAL_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Fetch only the explicit comparison commit. An unavailable or zero
          # before SHA is handled conservatively by the classifier as full scope.
          if [[ "$VISUAL_BASE_SHA" =~ ^[0-9a-fA-F]{40}$ ]] && [[ "$VISUAL_BASE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            if ! git cat-file -e "${VISUAL_BASE_SHA}^{commit}" 2>/dev/null; then
              timeout 60 git fetch --no-tags --depth=1 origin "$VISUAL_BASE_SHA" || echo "Comparison commit unavailable; full visual checks required."
            fi
          fi
          python3 scripts/visual-check-scope.py \
            --base "$VISUAL_BASE_SHA" --head "$VISUAL_HEAD_SHA" --event "$VISUAL_EVENT_NAME" \
            --github-output "$GITHUB_OUTPUT" --summary "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.1
      - uses: pnpm/action-setup@v6
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Secret guard
        run: pnpm check:secrets

      - name: Deployment preflight regression checks
        run: |
          # Do not rely on the runner's default shell flags: one failing check in
          # the middle must not be hidden by the last one succeeding.
          set -euo pipefail
          python3 scripts/test_deploy_preflight.py
          python3 scripts/test_visual_check_scope.py
          python3 scripts/test_backup_sh.py
          python3 ops/releases/test_backup_gate.py
          python3 ops/releases/test_storage_policy.py
          python3 ops/releases/test_release_retention.py
          node --test frontend/scripts/prepare-standalone.test.mjs
          node --test frontend/scripts/acquisition-continuity.test.mjs
          node --test scripts/check-dependency-audit.test.mjs
          python3 scripts/test_frontend_layer_reuse.py
          node --test ops/releases/test_check_backend.cjs
          python3 ops/releases/test_frontend_release.py
          (cd ops/releases && python3 -m unittest test_preparation_guard test_phase_runtime test_archive_transfer test_archive_identity test_release_browser test_release_candidate test_release_closeout test_procurement_versions -v)
          python3 ops/releases/test_acquisition_continuity.py
          python3 ops/releases/test_deployment_notice.py
          python3 ops/releases/test_data_backup.py
          python3 scripts/geo-migration/test_backup_rehearsal.py
      - name: Dependency audit with verified local fix
        run: node scripts/check-dependency-audit.mjs --report "$RUNNER_TEMP/dependency-audit.json"
      - name: Preserve dependency audit and patch verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/dependency-audit.json
            ${{ runner.temp }}/dependency-audit.json.verification.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Lint
        run: pnpm --dir frontend lint
      # Types are also checked by the build at the end of this job, but that is
      # seven minutes away; fail fast here instead.
      - name: Typecheck
        run: pnpm --dir frontend typecheck
      - name: Test
        run: pnpm --dir frontend test
      - name: Install deterministic CJK font
        if: steps.visual_scope.outputs.required != 'false'
        # runner 默认镜像 azure.archive.ubuntu.com 会整段无响应，apt 随后静默挂死：
        # 2026-08-19 实测两次，一次卡 2 小时、一次卡 27 分钟，全程零输出。
        # 改指官方源，每个 apt 调用单独套 timeout，再加步骤级超时兜底。
        # 刻意不换字体来源——视觉回归的基准图是用这个包渲染的，换了会整片对不上。
        timeout-minutes: 20
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # 不靠 runner 默认 shell 带的 -e：那是隐含行为，改一下 shell 配置就悄悄失效，
          # 安装失败会被 fc-cache 的成功退出码盖住（本地实测裸 bash 下退出 0）。
          set -euo pipefail
          # noble runner 走 /etc/apt/apt-mirrors.txt 这个镜像列表，
          # sources.list 里根本没有 azure 那个域名——只改 sources.list 是打空拳
          # （2026-08-19 实测：改完仍从 azure 拉 61MB 字体包，卡到 timeout 退 124）。
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            echo 'http://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          fi
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' \
            /etc/apt/sources.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
          for i in 1 2 3; do
            sudo timeout 120 apt-get update -qq && break
            echo "apt-get update 第 $i 次失败，重试"
            sleep 5
          done
          # 三次都失败也继续往下走：索引陈旧仍可能装得上，
          # 真装不上会在下一条 install 上明确报错，不会被悄悄放过。
          # 字体包 61MB，官方源可能不快；给足时间并重试，最后一次失败才算真失败。
          for i in 1 2 3; do
            sudo timeout 300 apt-get install -y --no-install-recommends fonts-noto-cjk && break
            [ "$i" = 3 ] && { echo "字体安装三次均失败。"; exit 1; }
            echo "apt-get install 第 $i 次失败，重试"
            sleep 10
          done
          fc-cache -f
      - name: Install visual test browser
        if: steps.visual_scope.outputs.required != 'false'
        timeout-minutes: 10
        run: pnpm --dir frontend exec playwright install --with-deps chromium
      - name: Visual regression
        if: steps.visual_scope.outputs.required != 'false'
        env:
          CI: true
          VISUAL_PROJECT: linux-chrome
        run: pnpm --dir frontend test:visual
      - name: Upload visual failure artifacts
        if: always() && steps.visual_scope.outputs.required != 'false' && failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-failure-${{ github.run_attempt }}
          path: |
            frontend/test-results/visual-artifacts
            frontend/test-results/visual-report
          if-no-files-found: ignore
          retention-days: 7
      - name: Build (also type-checks via next build)
        env:
          NEXT_PUBLIC_APP_NAME: Manufacturing Corporate Site
          NEXT_PUBLIC_DEFAULT_LOCALE: zh
          NEXT_PUBLIC_SITE_URL: https://example.com
          NEXT_PUBLIC_API_URL: /api
          NEXT_PUBLIC_API_BASE_URL: /api
          API_BASE_URL_INTERNAL: http://backend:3001/api
        run: pnpm --dir frontend build
      - name: Verify production news rendering
        run: node frontend/scripts/verify-production-news.mjs

  backend:
    name: Backend (lint + typecheck + test + build)
    services:
      content-test-db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: content_test
          POSTGRES_PASSWORD: ephemeral_ci_fixture
          POSTGRES_DB: content_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U content_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      CONTENT_GROWTH_TEST_DATABASE_URL: postgresql://content_test:ephemeral_ci_fixture@127.0.0.1:5432/content_test
    runs-on: ubuntu-latest
    # 实测约 1-2 分钟。默认 6 小时太长，卡住会白烧机器时间。
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.1
      - uses: pnpm/action-setup@v6
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm --dir backend prisma:generate
      - name: Lint
        run: pnpm --dir backend lint
      - name: Typecheck
        run: pnpm --dir backend exec tsc --noEmit -p tsconfig.json
      - name: Test
        run: pnpm --dir backend test
      - name: Build
        run: pnpm --dir backend build
      - name: Verify portable production package
        run: |
          set -euo pipefail
          pnpm --filter @corp-site/backend --prod deploy "$RUNNER_TEMP/backend-runtime"
          node "$RUNNER_TEMP/backend-runtime/node_modules/prisma/build/index.js" generate \
            --schema "$RUNNER_TEMP/backend-runtime/prisma/schema.prisma"
          node backend/scripts/verify-runtime.cjs "$RUNNER_TEMP/backend-runtime" --repair-self-link

  admin:
    name: Admin (lint + test + build)
    runs-on: ubuntu-latest
    # 实测约 5 分钟。默认 6 小时太长，卡住会白烧机器时间。
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.1
      - uses: pnpm/action-setup@v6
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm --dir admin lint
      - name: Test
        run: pnpm --dir admin test
      # admin build is `tsc -b && vite build`, so the build step also type-checks
      # (project-references mode; plain `tsc --noEmit` throws TS6310 here).
      - name: Build
        env:
          VITE_APP_NAME: Corporate Admin
          VITE_API_BASE_URL: /api
          VITE_APP_BASE_PATH: /
        run: pnpm --dir admin build
