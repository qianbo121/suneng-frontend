<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="905" viewBox="0 0 1000 905" role="img" aria-labelledby="title desc">
<title id="title">Atmosphere pressure: align the evidence</title><desc id="desc">Confirm the safety state before investigating process parameters.
Compare reliable records from equivalent operating conditions. Follow equipment and project documents for safety actions.
No universal alarm limits, shutdown sequence or reset is prescribed.</desc>
<rect width="100%" height="100%" rx="24" fill="#f3f6fa"/>
<rect x="0" y="0" width="1000" height="12" fill="#14558c"/>
<text x="52" y="78" font-family="Arial,sans-serif" font-size="36" font-weight="700" fill="#12324f">Atmosphere pressure: align the evidence</text>
<text x="52" y="126" font-family="Arial,sans-serif" font-size="25" fill="#475a70">Confirm the safety state before investigating process parameters.</text>
<text x="52" y="162" font-family="Arial,sans-serif" font-size="25" fill="#475a70">Compare reliable records from equivalent operating conditions.</text>
<rect x="42" y="205" width="916" height="145" rx="14" fill="white" stroke="#d1dce7"/>
<circle cx="83" cy="250" r="23" fill="#14558c"/>
<text x="83" y="259" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="white">1</text>
<text x="125" y="256" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#12324f">Locate the process stage</text>
<text x="70" y="296" font-family="Arial,sans-serif" font-size="25" fill="#334b63">Align the event with heating, cooling, gas admission,</text>
<text x="70" y="328" font-family="Arial,sans-serif" font-size="25" fill="#334b63">valve actions, exhaust and program transitions.</text>
<path d="M500 357 v15 m-7 -7 l7 7 7 -7" stroke="#66829c" fill="none" stroke-width="3"/>
<rect x="42" y="380" width="916" height="145" rx="14" fill="white" stroke="#d1dce7"/>
<circle cx="83" cy="425" r="23" fill="#14558c"/>
<text x="83" y="434" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="white">2</text>
<text x="125" y="431" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#12324f">Compare with the confirmed normal trend</text>
<text x="70" y="471" font-family="Arial,sans-serif" font-size="25" fill="#334b63">Coincidence with an action suggests a possible relationship.</text>
<text x="70" y="503" font-family="Arial,sans-serif" font-size="25" fill="#334b63">It does not prove that the change is normal.</text>
<path d="M500 532 v15 m-7 -7 l7 7 7 -7" stroke="#66829c" fill="none" stroke-width="3"/>
<rect x="42" y="555" width="916" height="145" rx="14" fill="white" stroke="#d1dce7"/>
<circle cx="83" cy="600" r="23" fill="#14558c"/>
<text x="83" y="609" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="white">3</text>
<text x="125" y="606" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#12324f">Cross-check equipment and measurement</text>
<text x="70" y="646" font-family="Arial,sans-serif" font-size="25" fill="#334b63">Compare supply, sealing, exhaust, sensors and loading.</text>
<text x="70" y="678" font-family="Arial,sans-serif" font-size="25" fill="#334b63">Persistent or unexplained deviations need wider checks.</text>
<text x="52" y="745" font-family="Arial,sans-serif" font-size="24" font-weight="600" fill="#8c3a21">Follow equipment and project documents for safety actions.</text>
<text x="52" y="778" font-family="Arial,sans-serif" font-size="24" font-weight="600" fill="#8c3a21">No universal alarm limits, shutdown sequence or reset is prescribed.</text>
</svg>