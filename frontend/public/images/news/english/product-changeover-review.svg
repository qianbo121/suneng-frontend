<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="905" viewBox="0 0 1000 905" role="img" aria-labelledby="title desc">
<title id="title">Product changeover: what must be checked?</title><desc id="desc">Sharing a furnace requires separate evidence for handling,
process compatibility and product acceptance. Validation depth follows process risk and agreed project documents.
Previous acceptance records do not replace evidence for new conditions.</desc>
<rect width="100%" height="100%" rx="24" fill="#f3f6fa"/>
<rect x="0" y="0" width="1000" height="12" fill="#14558c"/>
<text x="52" y="78" font-family="Arial,sans-serif" font-size="36" font-weight="700" fill="#12324f">Product changeover: what must be checked?</text>
<text x="52" y="126" font-family="Arial,sans-serif" font-size="25" fill="#475a70">Sharing a furnace requires separate evidence for handling,</text>
<text x="52" y="162" font-family="Arial,sans-serif" font-size="25" fill="#475a70">process compatibility and product acceptance.</text>
<rect x="42" y="205" width="916" height="145" rx="14" fill="white" stroke="#d1dce7"/>
<circle cx="83" cy="250" r="23" fill="#14558c"/>
<text x="83" y="259" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="white">1</text>
<text x="125" y="256" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#12324f">Within the confirmed range</text>
<text x="70" y="296" font-family="Arial,sans-serif" font-size="25" fill="#334b63">Use validated changeover operations; retain batch,</text>
<text x="70" y="328" font-family="Arial,sans-serif" font-size="25" fill="#334b63">program-version and first-piece records.</text>
<path d="M500 357 v15 m-7 -7 l7 7 7 -7" stroke="#66829c" fill="none" stroke-width="3"/>
<rect x="42" y="380" width="916" height="145" rx="14" fill="white" stroke="#d1dce7"/>
<circle cx="83" cy="425" r="23" fill="#14558c"/>
<text x="83" y="434" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="white">2</text>
<text x="125" y="431" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#12324f">Local change; basic limits remain unchanged</text>
<text x="70" y="471" font-family="Arial,sans-serif" font-size="25" fill="#334b63">Check affected items: clearance, fixtures, program and first piece.</text>
<text x="70" y="503" font-family="Arial,sans-serif" font-size="25" fill="#334b63">An unsuccessful check does not validate the whole batch.</text>
<path d="M500 532 v15 m-7 -7 l7 7 7 -7" stroke="#66829c" fill="none" stroke-width="3"/>
<rect x="42" y="555" width="916" height="145" rx="14" fill="white" stroke="#d1dce7"/>
<circle cx="83" cy="600" r="23" fill="#14558c"/>
<text x="83" y="609" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="white">3</text>
<text x="125" y="606" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#12324f">Core process or acceptance conditions change</text>
<text x="70" y="646" font-family="Arial,sans-serif" font-size="25" fill="#334b63">Revalidate the new combination of thermal cycle, atmosphere,</text>
<text x="70" y="678" font-family="Arial,sans-serif" font-size="25" fill="#334b63">cooling, supports, load, transfer and quality requirements.</text>
<text x="52" y="745" font-family="Arial,sans-serif" font-size="24" font-weight="600" fill="#8c3a21">Validation depth follows process risk and agreed project documents.</text>
<text x="52" y="778" font-family="Arial,sans-serif" font-size="24" font-weight="600" fill="#8c3a21">Previous acceptance records do not replace evidence for new conditions.</text>
</svg>