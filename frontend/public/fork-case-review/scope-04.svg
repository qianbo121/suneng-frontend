<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img"><title>2011 年技术文件的供货分工</title><rect width="1200" height="675" fill="#f1f5f7"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#173851"><text x="60" y="90" font-size="42" font-weight="700">燃气固溶炉的供货与试产分工</text><text x="62" y="139" font-size="23">2011 年技术文件 · 待核</text><rect x="54" y="188" width="532" height="295" rx="15" fill="#deebf5"/><rect x="614" y="188" width="532" height="295" rx="15" fill="#e2efe8"/><g font-size="31" font-weight="650"><text x="86" y="254">供方设备</text><text x="646" y="254">买方配套</text></g><g font-size="25"><text x="86" y="320">炉体、叉料车、燃气、供风</text><text x="86" y="375">排烟管道（含 18 米烟囱）</text><text x="86" y="430">燃烧、电控与设备资料</text><text x="646" y="320">料盘、工装吊具、垫铁</text><text x="646" y="375">试验工件和原辅材料</text><text x="646" y="430">厂房、基础及公用设施施工</text></g><rect x="54" y="520" width="1092" height="87" rx="11" fill="#18384f"/><text x="85" y="574" fill="#fff" font-size="28">文件所列验收条件　五炉试生产，并达到约定性能指标</text></g></svg>